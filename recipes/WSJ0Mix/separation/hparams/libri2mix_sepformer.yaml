# Data preparation
data_folder: LibriMix/data_folder/Libri2Mix/wav8k/min/processed
train_data: ${data_folder}/train.csv
valid_data: ${data_folder}/valid.csv
test_data: ${data_folder}/test.csv
num_spks: 2
sample_rate: 8000

# Training parameters
seed: 1234
batch_size: 4
lr: 0.001
epochs: 100
save_folder: results/libri2mix/sepformer
output_folder: ${save_folder}
device: ${device}

# Model parameters
encoder_channels: 256
encoder_kernel_size: 16
encoder_stride: 8
decoder_channels: 256
decoder_kernel_size: 16
decoder_stride: 8
masknet_channels: 256
masknet_kernel_size: 3
masknet_stride: 1
masknet_layers: 8
masknet_blocks: 4

# Data augmentation
use_speedperturb: true
use_rand_shift: true
use_wavedrop: true
drop_freq: true
drop_chunk: true
drop_chunk_length: 200
drop_chunk_prob: 0.5
drop_freq_prob: 0.5

# Training settings
clip_grad_norm: 5.0
loss_upper_lim: 100.0
threshold_byloss: true
threshold: 0.5

# Logging and checkpointing
save_audio: true
n_audio_to_save: 5

# Modules
modules:
  Encoder: !new:torch.nn.Conv1d
    in_channels: 1
    out_channels: ${encoder_channels}
    kernel_size: ${encoder_kernel_size}
    stride: ${encoder_stride}
    padding: 8
    bias: false
  Decoder: !new:torch.nn.ConvTranspose1d
    in_channels: ${encoder_channels}
    out_channels: 1
    kernel_size: ${decoder_kernel_size}
    stride: ${decoder_stride}
    padding: 8
    bias: false
  MaskNet: !new:speechbrain.nnet.separformer.Sepformer
    encoder_channels: ${encoder_channels}
    encoder_kernel_size: ${encoder_kernel_size}
    encoder_stride: ${encoder_stride}
    decoder_channels: ${decoder_channels}
    decoder_kernel_size: ${decoder_kernel_size}
    decoder_stride: ${decoder_stride}
    masknet_channels: ${masknet_channels}
    masknet_kernel_size: ${masknet_kernel_size}
    masknet_stride: ${masknet_stride}
    masknet_layers: ${masknet_layers}
    masknet_blocks: ${masknet_blocks}

# Optimizer
optimizer: !new:torch.optim.Adam
  lr: ${lr}
  weight_decay: 1e-5

# Scheduler
lr_scheduler: !new:speechbrain.nnet.schedulers.ReduceLROnPlateau
  factor: 0.5
  patience: 2
  min_lr: 1e-6

# Checkpointer
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: ${save_folder}
  recoverables:
    model: ${modules}
    optimizer: ${optimizer}
    counter: ${epoch_counter}

# Epoch counter
epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
  limit: ${epochs}

# Logger
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
  save_file: ${save_folder}/train_log.txt 